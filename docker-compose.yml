version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arkon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-arkon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkon} -d ${POSTGRES_DB:-arkon}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - arkon-network

  redis:
    image: redis:7-alpine
    container_name: arkon-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - arkon-network

  nats:
    image: nats:2.10-alpine
    container_name: arkon-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    command: >
      nats-server
      --port 4222
      --http_port 8222
      --cluster.listen 0.0.0.0:6222
      --routes nats-route://nats:6222
    volumes:
      - nats_data:/data
    restart: unless-stopped
    networks:
      - arkon-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: arkon-backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://arkon:arkon_dev_password@postgres:5432/arkon
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_WORKERS=1
      - BACKEND_RELOAD=true
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=["http://localhost:5173", "tauri://localhost"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/pyproject.toml:/app/pyproject.toml
    restart: unless-stopped
    networks:
      - arkon-network

  desktop:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
    container_name: arkon-desktop
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./apps/desktop/src:/app/src
      - ./apps/desktop/index.html:/app/index.html
      - ./apps/desktop/vite.config.ts:/app/vite.config.ts
      - ./apps/desktop/tailwind.config.js:/app/tailwind.config.js
      - ./apps/desktop/postcss.config.js:/app/postcss.config.js
      - ./apps/desktop/tsconfig.json:/app/tsconfig.json
      - ./apps/desktop/tsconfig.node.json:/app/tsconfig.node.json
    restart: unless-stopped
    networks:
      - arkon-network

  prometheus:
    image: prom/prometheus:latest
    container_name: arkon-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - arkon-network

  grafana:
    image: grafana/grafana:latest
    container_name: arkon-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - arkon-network

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:

networks:
  arkon-network:
    driver: bridge